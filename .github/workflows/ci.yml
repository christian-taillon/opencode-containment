name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check shell syntax
        run: |
          bash -n \
            install.sh \
            bin/opencode-container \
            bin/opencode-sandbox \
            bin/opencode2-container \
            bin/opencode2-containment \
            bin/opencode2-sandbox \
            bin/opencode-sandbox-alpha \
            scripts/install-sbx.sh \
            scripts/build-image.sh \
            scripts/container-init.sh \
            scripts/opencode-command.sh \
            scripts/web-server-entrypoint.sh \
            scripts/test-launcher.sh \
            scripts/test-runtime.sh \
            scripts/test-sandbox-image.sh \
            demo/run-demo.sh \
            demo/clean.sh \
            demo/listener.sh \
            demo/fake-env.sh

      - name: Test launcher
        run: bash scripts/test-launcher.sh

      - name: Test standalone sandbox alpha
        run: |
          mkdir -p /tmp/opencode
          python3 -B scripts/test-sandbox-alpha.py

      - name: Build image
        env:
          IMAGE_NAME: opencode-containment:ci
        run: bash scripts/build-image.sh

      - name: Smoke test image tools
        run: |
          docker run --rm --entrypoint uv opencode-containment:ci --version
          docker run --rm --entrypoint rustc opencode-containment:ci --version
          docker run --rm --entrypoint marksman opencode-containment:ci --version
          version="$(docker run --rm --entrypoint opencode opencode-containment:ci --version)"
          [[ "$version" == 'opencode v2.'* || "$version" == 2.* ]]

      - name: Build and verify V2 sandbox template image
        run: |
          OPENCODE_BUILD_TARGET=sandbox IMAGE_NAME=localhost/opencode-containment-sandbox:ci bash scripts/build-image.sh
          OPENCODE_TEST_SANDBOX_IMAGE=localhost/opencode-containment-sandbox:ci bash scripts/test-sandbox-image.sh

      - name: Verify V2 configuration, persistence, and authenticated web lifecycle
        env:
          OPENCODE_TEST_IMAGE: opencode-containment:ci
        run: bash scripts/test-runtime.sh

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opencode-containment:ci
          format: sarif
          output: trivy-results.sarif
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          cache: false

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: trivy-results.sarif
